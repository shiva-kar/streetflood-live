name: Supabase Free-Tier Keepalive

on:
  schedule:
    # Run once every 3 days at 04:00 UTC (well within the 7-day inactivity pause window)
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keepalive RPC
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "Supabase secrets not configured yet. Skipping keepalive ping."
            exit 0
          fi
          
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          
          echo "Supabase Keepalive Response: $RESPONSE"
